name: Check & Release

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

# Read by default so the jobs running third-party actions cannot touch the repository; only the
# release job, which runs first-party actions only, is granted write.
permissions:
  contents: read

# Serialised per branch: the release job reads the tags its predecessor published and the dev
# prune deletes every prerelease but its own, so overlapping runs would drop or delete a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NIM_VERSION: '2.2.12'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # nim.cfg names the android/arm64 target this library is built for. Nimony is the other
      # half of the gate, but ships as a nightly zip a workflow cannot pin, so it stays local.
      - name: Type-check Nim
        run: make check

      - name: Check Nim formatting
        run: |
          fail=0
          tmp=$(mktemp -d)
          for f in src/*.nim src/nemohooks/*.nim src/nemohooks/backends/*.nim examples/*.nim; do
            cp "$f" "$tmp/$(basename "$f")"
            nimpretty --maxLineLen:100 --out:"$tmp/$(basename "$f")" "$f"
            if ! diff -u "$f" "$tmp/$(basename "$f")"; then
              echo "::error file=$f::not formatted (run 'make fmt')"
              fail=1
            fi
          done
          exit $fail

      # A bad srcDir, or a main module not matching the package name, only shows up here.
      - name: Check the package installs
        run: nimble install -y

  version:
    needs: lint
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: v
        run: |
          set -euo pipefail

          # Plain `vX.Y.Z`, which is what nimble and pnak resolve a `requires` range against.
          # Prereleases carry a -dev.N suffix and are excluded: the bump is always measured
          # from the last stable release.
          stable_tag=$(git tag -l 'v[0-9]*' | grep -v -- '-dev\.' | sort -V | tail -1 || true)
          declared=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' nemohooks.nimble)

          if [ -z "$stable_tag" ]; then
            # First release: publish the version the .nimble already declares.
            next="$declared"
            range=""
            bump="none (first release, taken from nemohooks.nimble)"
          else
            base=$(echo "${stable_tag#v}" | awk -F. '{printf "%d.%d.%d", $1, $2, ($3=="" ? 0 : $3)}')
            major=$(echo "$base" | cut -d. -f1)
            minor=$(echo "$base" | cut -d. -f2)
            patch=$(echo "$base" | cut -d. -f3)
            range="$stable_tag..HEAD"

            # Conventional Commits drive the bump. A `!` before the colon marks a breaking change,
            # as does a BREAKING CHANGE footer in the body; `feat` is a minor, anything else a patch.
            # Anchored at the start of the subject so a commit *describing* a type cannot trip it.
            subjects=$(git log --pretty=%s "$range")
            bodies=$(git log --pretty=%B "$range")
            if echo "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
               || echo "$bodies" | grep -qE '^BREAKING[ -]CHANGE:'; then
              major=$((major + 1)); minor=0; patch=0; bump=major
            elif echo "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then
              minor=$((minor + 1)); patch=0; bump=minor
            else
              patch=$((patch + 1)); bump=patch
            fi
            next="$major.$minor.$patch"
          fi

          # main is the stable channel, dev the prerelease one. Both cut the same version; only
          # dev qualifies it with how many commits have landed since the last stable release.
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            channel=stable
            name="$next"
            prerelease=false
          else
            channel=dev
            n=$(git log --pretty=%s ${range:+$range} | grep -vc '^chore(release):' || true)
            [ "$n" -lt 1 ] && n=1
            name="$next-dev.$n"
            prerelease=true
          fi

          # Only the paths a consumer compiles count as a change worth a dev tag, so a docs or
          # workflow push does not burn one. main always publishes: a stable release is a
          # deliberate act, not a consequence of what happened to change.
          publish=true
          if [ "$channel" = dev ]; then
            prev=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
            if [ -n "$prev" ] && git diff --quiet "$prev" HEAD -- src nemohooks.nimble nim.cfg; then
              publish=false
              echo "no library source change since $prev, skipping the release"
            fi
          fi

          {
            echo "name=$name"
            echo "tag=v$name"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### $name ($channel)"
            echo
            # The bump commits this job writes stay out of the notes.
            git log --pretty='- %s' ${range:+$range} | grep -v '^- chore(release):' || true
          } > changelog.md
          cat changelog.md
          echo "bump: $bump, from ${stable_tag:-no previous tag}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: changelog
          path: changelog.md

  release:
    needs: version
    # Only a real push publishes; the owner check keeps a fork from publishing here.
    if: >-
      github.event_name == 'push'
      && needs.version.outputs.publish == 'true'
      && github.repository == 'git-morin/nemo-hooks'
      && github.actor == 'git-morin'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: changelog

      # nimble reads the version from the .nimble at the tagged commit, not from the tag name,
      # so the bump is committed before the tag is cut. Only the stable channel does this: a
      # prerelease is pinned by tag or commit, never resolved from a `requires` range, and a
      # release commit per push to dev would be noise in the history.
      - name: Bump the declared version and tag it
        if: needs.version.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already published, nothing to do"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          sed -i "s/^version .*/version       = \"$NAME\"/" nemohooks.nimble
          grep -q "\"$NAME\"" nemohooks.nimble

          # [skip ci] is load-bearing: this push lands on main and would retrigger the workflow.
          if ! git diff --quiet -- nemohooks.nimble; then
            git commit -q -m "chore(release): $NAME [skip ci]" -- nemohooks.nimble
            git push origin HEAD:main
          fi

          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          NAME: ${{ needs.version.outputs.name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already published, nothing to do"
            exit 0
          fi
          flags=(--title "$NAME" --notes-file changelog.md --target "${RELEASE_SHA:-$GITHUB_SHA}")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}"

      # dev is a moving target, so keep only the newest prerelease and let its tag go with it.
      - name: Prune superseded dev prereleases
        if: needs.version.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease) | .tagName' \
          | grep -- '-dev\.' | grep -vx "$TAG" \
          | while read -r old; do
              echo "deleting superseded $old"
              gh release delete "$old" --yes --cleanup-tag
            done
