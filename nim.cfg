# The library only ever builds as part of an Android module, so checking it standalone needs
# the same target the consumer compiles for. A consumer's own nim.cfg governs the real build;
# Nim and Nimony read config from the project tree, not from a dependency's.
--os:android
--cpu:arm64
--noMain:on
-d:noSignalHandler
-d:useMalloc
--mm:atomicArc
--threads:on
